# nginx 在這裡只做一件事:把一包靜態檔送出去。沒有反向代理、沒有後端
# ——API 是瀏覽器自己去打 trading-api 的,不經過這裡。

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 記錄寫到標準輸出,交給 kubectl logs。寫進檔案的話它會在容器裡慢慢長大,
    # 而沒有人會去看。
    access_log /dev/stdout;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

    # 不上 root 的映像檔(nginx-unprivileged)沒辦法寫預設的那些暫存目錄,
    # 所以全部指到 /tmp。
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml font/woff2;

    server {
        # 8080 而不是 80:這個 server 不是 root 跑的,綁不了 1024 以下的埠。
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;

        # 探針打這裡。用 /health 而不是 / 的理由是它不會被 SPA 的 fallback
        # 接走——那條規則會讓「任何路徑」都回 200,連探針都分不出服務壞了沒。
        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # 指紋化的資產(檔名含 hash)可以放心長期快取:內容變了檔名就變了。
        location /_nuxt/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # HTML 不快取。快取住的話,部署了新版本的使用者會一直拿到舊的那份
        # ——而舊的 HTML 指向的是已經被刪掉的 _nuxt 檔名,畫面直接白掉。
        location / {
            add_header Cache-Control "no-cache";
            # 這一行就是整份設定的重點。
            #
            # 兩條路由的 id 來自資料庫,預先產出時不可能知道,所以
            # /strategy-bots/<某個 id> 在磁碟上沒有對應的檔案。找不到就交給
            # 200.html——它是同一個 SPA 外殼,由前端的 router 自己去解析路徑。
            #
            # 不是 404.html:那會讓一個存在的頁面回 404 狀態碼。
            # $uri/index.html 而不是 $uri/:後者找到目錄就會發一個 301 去補
            # 結尾斜線,每次換頁多一次來回,而且使用者看到的網址會被改掉。
            # 直接指到裡面那份 index.html 就沒有這一跳。
            try_files $uri $uri/index.html /200.html;
        }
    }
}
