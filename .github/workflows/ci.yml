# 這個檔案存在的理由是：**commit 之前沒有人在跑測試。**
#
# pre-commit hook 只做兩件事——對 staged 的檔案跑 ESLint --fix，然後 typecheck。
# 那擋得住打錯字，擋不住一次改壞行為的修改：兩千多則測試在 commit 的那一刻
# 一則都沒跑過。所以「本機是綠的」在這個專案裡從來不等於「它還會動」。
#
# 另外一件 hook 做不到的事：它只看**staged 的檔案**。把一個 export 改名、
# 卻只 stage 其中一邊時，hook 看不到另一邊——那正是最容易漏的那一種。
# 這裡一律看整個專案。

name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一條分支的第二次 push 會讓第一次的答案失去意義。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          # 版本從 package.json 的 packageManager 讀，不在這裡寫第二份——
          # 寫死的話，升級 bun 的那天有一邊會被忘記，而 CI 與本機跑在不同版本上
          # 是最難查的那種失敗。
          bun-version-file: package.json

      # bun 的下載快取。node_modules 本身不快取：它跟著 lockfile 走，
      # 而快取一份可能過期的 node_modules 正好會掩蓋 --frozen-lockfile 想抓的東西。
      - name: cache bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # --frozen-lockfile：lockfile 與 package.json 對不起來就失敗，
      # 而不是安靜地裝一個別的版本然後照樣綠燈。
      - name: install
        run: bun install --frozen-lockfile

      # 以下四步就是 `bun run verify`，但**拆開跑**。
      # 合成一步的話，GitHub 上只看得到「verify 失敗」，要點進 log 才知道是
      # 型別壞了還是某一則測試紅了。拆開之後，失敗的那一格自己會說話。
      - name: eslint
        run: bun run lint

      - name: stylelint
        run: bun run lint:style

      # typecheck 要有 .nuxt 底下產生出來的型別才跑得動，那是 postinstall 的
      # `nuxt prepare` 做的——所以它一定要排在 install 之後。
      - name: typecheck
        run: bun run typecheck

      - name: test
        run: bun run test

  # 前端從這裡開始跟另外兩個服務走同一條路:編成映像檔、推 GHCR、把版本號寫回
  # 部署 repo,由 Argo 套用。它不再部署到 Vercel。
  publish:
    needs: verify

    # Pull request 不會走到這裡。這個 repository 是公開的,任何人都能開一個,
    # 而 fork 的 PR 不該有機會把映像檔放到這個名字底下。
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    # 下面那個 deploy job 要寫進 manifest 的標籤。
    outputs:
      tag: ${{ steps.version.outputs.tag }}

    permissions:
      contents: read
      # 唯一多出來的權限。有了它,這個 job 內建的 token 就推得了 GHCR,
      # 不必另外建立、保存、輪替任何 registry 密碼。
      packages: write

    steps:
      - uses: actions/checkout@v5

      # 版本號在這裡算一次,推上去的標籤和寫回部署的標籤都用這一個值。
      # 算兩次就會多出「它們一樣嗎」這個問題,而那個問題的錯誤形式是
      # 部署指向一個從來沒被推上去的標籤。
      - id: version
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.tag }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # provenance/sbom 關掉。它們每次推都會多一個沒有標籤的 manifest,
          # 在免費帳號上只買到更快撞到容量上限;關掉之後一次推等於一個版本,
          # 那正是下面 prune 依賴的前提。
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 舊版本沒有別的東西會刪,而這個帳號的私有套件只有 500 MB。放著不管,
  # 上限會安靜地到達,而它announce自己的方式是下一次推送失敗。
  prune:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      packages: write

    steps:
      # 五版而不是一版:要回退得回得去,而最可能被想回去的正是剛被取代的那一版。
      - uses: actions/delete-package-versions@v5
        with:
          package-name: go-trading-frontend
          package-type: container
          min-versions-to-keep: 5

  # 最後一環。推上映像檔本身不改變任何事——要有人說「跑這一個」,而那個人是
  # 部署 repository 裡的一次 commit,因為 Argo CD 只讀 git。
  deploy:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      # 這個 job 不需要這個 repository 的任何權限。它要寫的是另一個 repository,
      # 而那把鑰匙是一把只認得那一個 repository 的 deploy key。
      contents: read

    steps:
      - uses: actions/checkout@v5
        with:
          repository: CodeMachine0121/go-trading-deploy
          ssh-key: ${{ secrets.DEPLOY_REPO_SSH_KEY }}
          ref: main
          # 完整歷史:下面搶輸的時候要 rebase,淺層 clone 沒有東西可以 rebase。
          fetch-depth: 0

      - name: Point the deployment at this commit
        env:
          IMAGE: ghcr.io/codemachine0121/go-trading-frontend
          TAG: ${{ needs.publish.outputs.tag }}
          # 走環境變數,絕不內插進下面的腳本。commit message 是別人寫的文字,
          # `${{ }}` 貼進 shell 會執行它剛好寫了什麼。
          SOURCE_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          # yq 而不是 sed:它設定的是「名字等於這個映像檔的那一項的 newTag」,
          # 不是檔案裡剛好長得對的那一行。runner 內建,沒有版本要釘。
          yq -i "(.images[] | select(.name == strenv(IMAGE)) | .newTag) = strenv(TAG)" \
            go-trading-frontend/kustomization.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add go-trading-frontend/kustomization.yaml
          if git diff --cached --quiet; then
            echo "deployment already points at $TAG"
            exit 0
          fi

          SUBJECT=$(printf '%s\n' "$SOURCE_MESSAGE" | head -1)
          git commit -m "Deploy go-trading-frontend $TAG" \
                     -m "${GITHUB_REPOSITORY}@${GITHUB_SHA}" \
                     -m "$SUBJECT"

          # 三個服務寫同一個 repository,所以同時發版時會有人的推送被拒。
          # rebase 重試而不是 force:對方寫的是別的服務的版本號,兩邊都要留下。
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push refused, rebasing onto what landed first (attempt $attempt)"
            git pull --rebase
          done

          echo "::error::could not write the deployment update after three attempts"
          exit 1
