<!--
  門口的載入：打開或重新整理操作台時，還不知道你是誰之前唯一畫出來的東西。

  它是一份靜態 HTML，因為它出現的時候**什麼都還沒跑起來**——沒有 Vue、沒有樣式表、
  也還沒問過後端你是誰。Nuxt 把它放進 #__nuxt，等身分確認完、第一個畫面真的畫好了
  才換掉它；於是沒登入的人從頭到尾只看得到登入卡片的位置，不會先看到一片空白的操作台。

  **這裡的值是字面值**：它畫出來的那一刻，design token 還不存在。每一個抄自 token 的值
  旁邊都標著它抄的是哪一個（`token: $表.名字`），`bun run lint:tokens` 逐一比對
  app/assets/styles/abstracts/ 裡的那一份——改了 token 沒改這裡，檢查就不會過。
  沒有標註的那幾個（轉圈的大小與速度、邊線粗細）是這一張卡片自己的，不是 token。
-->
<style>
  /* 全站的 rem 都以放大過的根字級為準；少了這一行，門口這張卡片會比登入卡片小一號。 */
  html {
    font-size: 112.5%; /* token: $root-font-scale */
  }

  .door {
    display: flex;
    position: fixed;
    align-items: center;
    justify-content: center;
    inset: 0;
    background-color: #0a0c10; /* token: $colors.background */
    padding: 1.25rem; /* token: $spacings.lg */
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', 'Noto Sans TC', sans-serif; /* token: $font-families.base */
    isolation: isolate;
  }

  .door__card {
    display: flex;
    position: relative;
    flex-direction: column;
    align-items: center;
    gap: 1rem; /* token: $spacings.md */
    box-shadow: 0 8px 24px rgb(0 0 0 / 45%); /* token: $shadows.md */
    border: 1px solid #222833; /* token: $colors.border */
    border-radius: 0.625rem; /* token: $radii.md */
    background-color: #11141a; /* token: $colors.surface */
    padding: 1.5rem 1.25rem; /* token: $spacings.xl $spacings.lg */
    width: 100%;
    max-width: 22rem;
  }

  /* 寬螢幕上間距換成收緊的那一套，與登入卡片同一個時刻換。 */
  @media (width >= 768px) { /* token: $breakpoints.md */
    .door {
      padding: 1.5rem; /* token: $spacings-compact.lg */
    }

    .door__card {
      padding: 2rem 1.5rem; /* token: $spacings-compact.xl $spacings-compact.lg */
    }
  }

  .door__card::before {
    position: absolute;
    z-index: -1;
    /* 這張卡片比登入卡片矮，同一個 circle 漸層在它的四個角還沒淡完就被切掉，
       會看得到一圈方方的邊。收到最近的邊為止，光暈就一路淡到透明。 */
    background: radial-gradient(closest-side, rgb(139 123 255 / 14%), transparent); /* token: $colors.primary-soft */
    content: '';
    inset: -40%;
    pointer-events: none;
  }

  .door__brand {
    display: flex;
    gap: 0.625rem; /* token: $spacings.xs */
    align-items: center;
    color: #f1f3f7; /* token: $colors.text-strong */
    font-weight: 600; /* token: $font-weights.semibold */
    font-size: 0.8125rem; /* token: $font-sizes.sm */
    font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', 'Cascadia Mono', monospace; /* token: $font-families.mono */
  }

  .door__brand-mark {
    border-radius: 9999px; /* token: $radii.pill */
    background-color: #8b7bff; /* token: $colors.primary */
    width: 0.5rem;
    height: 0.5rem;
  }

  .door__spinner {
    animation: door-spin 0.9s linear infinite;
    border: 2px solid #222833; /* token: $colors.border */
    border-top-color: #8b7bff; /* token: $colors.primary */
    border-radius: 9999px; /* token: $radii.pill */
    width: 1.75rem;
    height: 1.75rem;
  }

  .door__caption {
    margin: 0;
    color: #808999; /* token: $colors.text-faint */
    font-size: 0.8125rem; /* token: $font-sizes.sm */
  }

  /* 淺色：門口出現時還讀不到使用者選的外觀，所以只看系統；選了深色的人在淺色系統上會先看到一瞬間的淺色門口。 */
  @media (prefers-color-scheme: light) {
    .door {
      background-color: #f5f6f8; /* token: $colors-light.background */
    }

    .door__card {
      box-shadow: 0 8px 24px rgb(17 21 28 / 10%); /* token: $shadows-light.md */
      border: 1px solid #e2e5ea; /* token: $colors-light.border */
      background-color: #fff; /* token: $colors-light.surface */
    }

    .door__card::before {
      background: radial-gradient(closest-side, rgb(106 87 238 / 10%), transparent); /* token: $colors-light.primary-soft */
    }

    .door__brand {
      color: #11151c; /* token: $colors-light.text-strong */
    }

    .door__brand-mark {
      background-color: #6a57ee; /* token: $colors-light.primary */
    }

    .door__spinner {
      border: 2px solid #e2e5ea; /* token: $colors-light.border */
      border-top-color: #6a57ee; /* token: $colors-light.primary */
    }

    .door__caption {
      color: #646d7e; /* token: $colors-light.text-faint */
    }
  }

  @keyframes door-spin {
    to {
      transform: rotate(360deg);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .door__spinner {
      animation-duration: 2.4s;
    }
  }
</style>

<div class="door">
  <div
    class="door__card"
    role="status"
    aria-live="polite"
  >
    <div class="door__brand">
      <span class="door__brand-mark"></span>
      <span>go-trading</span>
    </div>
    <div class="door__spinner" aria-hidden="true"></div>
    <p class="door__caption">正在確認登入狀態…</p>
  </div>
</div>
